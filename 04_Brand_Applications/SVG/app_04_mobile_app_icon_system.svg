<text x="116" y="856.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#5A6072">WHY THE SILHOUETTE HOLDS AT 16×16 PX:</text>
<text x="116" y="879.55" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#5A6072">Because the negative-space channel between the primary vault and cantilevered crossbar is</text>
<text x="116" y="902.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#5A6072">14.3% of total symbol height (with zero hairline strokes or gradients), the AETHRA mark never</text>
<text x="116" y="926.05" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#5A6072">plugs or blurs at tiny pixel densities.</text>
