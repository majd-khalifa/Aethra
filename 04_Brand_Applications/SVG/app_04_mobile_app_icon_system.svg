<text x="88" y="71.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#0D1017" letter-spacing="1.12px">AETHRA BRAND APPLICATIONS  //  04 — MOBILE APP ICON SYSTEM &amp; SCALE PROOF</text>
<text x="1536" y="71.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px" text-anchor="end">iOS / ANDROID / FAVICON (1024PX -&gt; 16PX)</text>
<text x="80" y="144.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.04px">01 // MASTER APP ICON VARIANTS (iOS / ANDROID SQUIRCLE GEOMETRY)</text>
