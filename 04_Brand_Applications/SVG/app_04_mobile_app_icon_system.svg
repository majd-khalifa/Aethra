<text x="80" y="496.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.04px">02 // MULTI-RESOLUTION SILHOUETTE &amp; COUNTERFORM PROOF (256PX DOWN TO 16PX)</text>
