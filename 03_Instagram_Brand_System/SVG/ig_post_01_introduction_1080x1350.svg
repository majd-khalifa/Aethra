<text x="974" y="89.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#5A6072" letter-spacing="1.2px" text-anchor="end">01  //  MANIFESTO</text>
<text x="76" y="1266.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#0D1017" letter-spacing="1.5px">AETHRA.DEV</text>
<text x="1004" y="1265.48" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="14" fill="#5A6072" letter-spacing="0.84px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="564" y="158.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#5A6072" letter-spacing="0.78px">FIG 01.A — NEGATIVE-SPACE PHASE CHANNEL</text>
<text x="112" y="177.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#1838E0" letter-spacing="1.2px">ORIGIN &amp; PHILOSOPHY</text>
<text x="84" y="234.5" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">Ideas begin invisibly</text>
<text x="84" y="270.0" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">in the mind.</text>
<text x="84" y="305.5" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017"></text>
<text x="84" y="341.0" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">Through logic,</text>
<text x="84" y="376.5" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">architecture, and</text>
<text x="84" y="412.0" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">engineering, they</text>
<text x="84" y="447.5" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">become working</text>
<text x="84" y="483.0" font-family="'Inter', sans-serif" font-weight="400" font-size="25" fill="#0D1017">digital reality.</text>
<text x="84" y="596.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#5A6072" letter-spacing="1.2px">SOFTWARE  •  SYSTEMS  •  APPLICATIONS</text>
<text x="84" y="875.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="78" fill="#0D1017" letter-spacing="-2.34px">From the unseen to</text>
<text x="84" y="957.86" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="78" fill="#0D1017" letter-spacing="-2.34px">the extraordinary.</text>
<text x="84" y="1036.86" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#5A6072">Every reliable system begins as an abstract thought. AETHRA partners with</text>
<text x="84" y="1071.36" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#5A6072">ambitious companies to engineer custom software, scalable web platforms,</text>
<text x="84" y="1105.86" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#5A6072">and resilient digital infrastructure built to endure.</text>
