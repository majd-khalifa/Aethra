<text x="974" y="89.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#F5F3EE" fill-opacity="0.85" letter-spacing="1.2px" text-anchor="end">02  //  CAPABILITIES</text>
<text x="76" y="1266.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#F5F3EE" letter-spacing="1.5px">AETHRA.DEV</text>
<text x="1004" y="1265.48" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="14" fill="#F5F3EE" fill-opacity="0.75" letter-spacing="0.84px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="110" y="175.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#1838E0" letter-spacing="1.2px">FULL-STACK ENGINEERING DISCIPLINES</text>
<text x="84" y="246.64" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="52" fill="#F5F3EE" letter-spacing="-1.3px">Engineered across</text>
<text x="84" y="302.8" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="52" fill="#F5F3EE" letter-spacing="-1.3px">the entire stack.</text>
<text x="576" y="223.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.75">We do not deliver disconnected</text>
<text x="576" y="252.08" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.75">templates. We architect, build, and</text>
<text x="576" y="280.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.75">integrate complete technical</text>
<text x="576" y="309.08" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.75">ecosystems tailored to your logic.</text>
<text x="84" y="453.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#E84A27" letter-spacing="1.12px">01 // CORE LOGIC</text>
<text x="84" y="513.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Custom Software</text>
<text x="84" y="565.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">Bespoke business software, domain engines,</text>
<text x="84" y="593.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">and internal operational platforms.</text>
<text x="576" y="453.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">02 // PLATFORMS</text>
<text x="576" y="513.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Web Applications</text>
<text x="576" y="565.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">High-performance SaaS products, client</text>
<text x="576" y="593.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">portals, and responsive web architecture.</text>
<text x="84" y="724.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">03 // CLIENT INTERFACES</text>
<text x="84" y="784.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Mobile Applications</text>
<text x="84" y="836.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">Native and cross-platform iOS &amp; Android</text>
<text x="84" y="864.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">applications with offline-first resilience.</text>
<text x="576" y="724.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">04 // INFRASTRUCTURE</text>
<text x="576" y="784.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Backend &amp; APIs</text>
<text x="576" y="836.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">REST &amp; GraphQL API gateways, microservices,</text>
<text x="576" y="864.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">and high-concurrency server architecture.</text>
<text x="84" y="995.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">05 // DATA LAYER</text>
<text x="84" y="1055.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Database Systems</text>
<text x="84" y="1107.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">Relational schema design, distributed data</text>
<text x="84" y="1135.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">pipelines, and zero-downtime migrations.</text>
<text x="576" y="995.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">06 // ORCHESTRATION</text>
<text x="576" y="1055.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#F5F3EE" letter-spacing="-0.68px">Systems &amp; Automation</text>
<text x="576" y="1107.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">ERP/CRM integrations, webhook orchestration,</text>
<text x="576" y="1135.7" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#F5F3EE" fill-opacity="0.72">and automated operational workflows.</text>
</svg>