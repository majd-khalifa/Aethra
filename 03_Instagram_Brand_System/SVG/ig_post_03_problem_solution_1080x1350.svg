<text x="974" y="89.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#5A6072" letter-spacing="1.2px" text-anchor="end">03  //  TRANSFORMATION</text>
<text x="76" y="1266.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#0D1017" letter-spacing="1.5px">AETHRA.DEV</text>
<text x="1004" y="1265.48" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="14" fill="#5A6072" letter-spacing="0.84px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="84" y="167.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#E84A27" letter-spacing="1.12px">STATE A // THE UNSEEN BOTTLENECK</text>
<text x="84" y="236.28" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="54" fill="#0D1017" letter-spacing="-1.35px">Complexity isn’t</text>
<text x="84" y="294.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="54" fill="#0D1017" letter-spacing="-1.35px">the problem.</text>
<text x="84" y="352.92" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="54" fill="#0D1017" letter-spacing="-1.35px">Fragmentation is.</text>
<text x="598" y="191.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">DIAGNOSTIC: BRITTLE PATCHWORK</text>
<text x="681.0" y="257.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#0D1017" text-anchor="middle">MANUAL CSV SYNC</text>
<text x="886.0" y="245.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#0D1017" text-anchor="middle">ISOLATED CRM</text>
<text x="769.0" y="347.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#0D1017" text-anchor="middle">LEGACY DATABASE</text>
<text x="676.0" y="447.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#0D1017" text-anchor="middle">BRITTLE WEBHOOK</text>
<text x="891.0" y="437.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#0D1017" text-anchor="middle">SILOED BILLING</text>
<text x="84" y="465.22" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#5A6072">Growing companies outgrow off-the-shelf</text>
<text x="84" y="496.3" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#5A6072">patchwork. Disconnected tools create</text>
<text x="84" y="527.38" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#5A6072">manual workarounds, data drift, and</text>
<text x="84" y="558.46" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#5A6072">operational fragility.</text>
<text x="252" y="693.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" letter-spacing="1.12px" text-anchor="middle">AETHRA ARCHITECTURAL THRESHOLD</text>
<text x="84" y="745.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#F5F3EE" fill-opacity="0.8" letter-spacing="1.12px">STATE B // ENGINEERED COHERENCE</text>
<text x="84" y="817.56" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="58" fill="#F5F3EE" letter-spacing="-1.45px">One unified core.</text>
<text x="84" y="879.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="58" fill="#F5F3EE" letter-spacing="-1.45px">Zero friction.</text>
<text x="84" y="943.22" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#F5F3EE" fill-opacity="0.88">We replace brittle workarounds with a</text>
<text x="84" y="974.3" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#F5F3EE" fill-opacity="0.88">single coherent software architecture—</text>
<text x="84" y="1005.38" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#F5F3EE" fill-opacity="0.88">unifying your database, APIs, and</text>
<text x="84" y="1036.46" font-family="'Inter', sans-serif" font-weight="400" font-size="21" fill="#F5F3EE" fill-opacity="0.88">interfaces around how you actually work.</text>
<text x="598" y="763.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#F5F3EE" fill-opacity="0.7" letter-spacing="0.72px">SOLUTION: UNIFIED DOMAIN ARCHITECTURE</text>
<text x="644" y="820.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#F5F3EE">WEB &amp; MOBILE CLIENTS</text>
<text x="644" y="884.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#F5F3EE">AUTOMATED WORKFLOWS</text>
<text x="644" y="948.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#F5F3EE">EXTERNAL INTEGRATIONS</text>
<text x="718" y="1072.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#F5F3EE">AETHRA CORE ENGINE</text>
<text x="718" y="1095.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#F5F3EE" fill-opacity="0.85">SINGLE SOURCE OF TRUTH • API BUS</text>
</svg>