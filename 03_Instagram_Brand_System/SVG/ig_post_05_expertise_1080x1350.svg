<text x="974" y="89.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#F5F3EE" fill-opacity="0.85" letter-spacing="1.2px" text-anchor="end">05  //  ENGINEERING NOTE</text>
<text x="76" y="1266.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#F5F3EE" letter-spacing="1.5px">AETHRA.DEV</text>
<text x="1004" y="1265.48" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="14" fill="#F5F3EE" fill-opacity="0.75" letter-spacing="0.84px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="182" y="180.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#F5F3EE" letter-spacing="0.96px" text-anchor="middle">ARCHITECTURAL PRINCIPLE</text>
<text x="84" y="269.76" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#F5F3EE" letter-spacing="-1.7px">Why API-first</text>
<text x="84" y="341.16" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#F5F3EE" letter-spacing="-1.7px">architecture outlives</text>
<text x="84" y="412.56" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#F5F3EE" letter-spacing="-1.7px">interface trends.</text>
<text x="116" y="504.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#F5F3EE" fill-opacity="0.75" letter-spacing="1.04px">SCHEMATIC 05.1 // DECOUPLED DOMAIN LIFECYCLE</text>
<text x="136" y="569.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#0D1017">CORE DOMAIN &amp; DATA LAYER</text>
<text x="136" y="625.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#E84A27">LIFESPAN: 10+ YEARS</text>
<text x="136" y="665.94" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#F5F3EE">• Normalized Database Schema</text>
<text x="136" y="693.99" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#F5F3EE">• Core Business Rules &amp; Auth</text>
<text x="136" y="722.04" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#F5F3EE">• Versioned REST / GraphQL API</text>
<text x="136" y="750.09" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#F5F3EE">• Audit Logs &amp; Security Policy</text>
<text x="520" y="711.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">API BUS</text>
<text x="608" y="593.22" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="21" fill="#F5F3EE">WEB APPLICATION UI</text>
<text x="608" y="618.66" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="13" fill="#F5F3EE" fill-opacity="0.7">CYCLE: 3–4 YEARS  |  NEXT.JS / REACT</text>
<text x="608" y="701.22" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="21" fill="#F5F3EE">MOBILE APP CLIENTS</text>
<text x="608" y="726.66" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="13" fill="#F5F3EE" fill-opacity="0.7">CYCLE: 2–3 YEARS  |  iOS &amp; ANDROID</text>
<text x="608" y="809.22" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="21" fill="#F5F3EE">AI &amp; AUTOMATION AGENTS</text>
<text x="608" y="834.66" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="13" fill="#F5F3EE" fill-opacity="0.7">CYCLE: CONTINUOUS  |  WEBHOOKS &amp; SDK</text>
<text x="84" y="971.68" font-family="'Inter', sans-serif" font-weight="400" font-size="24" fill="#F5F3EE">Interfaces evolve every three years. Core business logic lasts a decade.</text>
<text x="84" y="1007.68" font-family="'Inter', sans-serif" font-weight="400" font-size="24" fill="#F5F3EE">When you decouple your data and API layer from presentation, redesigning</text>
<text x="84" y="1043.68" font-family="'Inter', sans-serif" font-weight="400" font-size="24" fill="#F5F3EE">your product never requires rebuilding your company.</text>
</svg>