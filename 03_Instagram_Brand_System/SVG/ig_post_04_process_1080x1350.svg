<text x="974" y="89.3" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="15" fill="#5A6072" letter-spacing="1.2px" text-anchor="end">04  //  METHODOLOGY</text>
<text x="76" y="1266.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#0D1017" letter-spacing="1.5px">AETHRA.DEV</text>
<text x="1004" y="1265.48" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="14" fill="#5A6072" letter-spacing="0.84px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="110" y="173.3" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="15" fill="#1838E0" letter-spacing="1.2px">FROM ABSTRACTION TO PRODUCTION</text>
<text x="84" y="254.12" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="66" fill="#0D1017" letter-spacing="-1.65px">How an idea becomes</text>
<text x="84" y="324.08" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="66" fill="#0D1017" letter-spacing="-1.65px">working infrastructure.</text>
<text x="84" y="411.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">STAGE 01</text>
<text x="84" y="527.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.6px">WIREFRAME // ABSTRACT</text>
<text x="380" y="441.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#0D1017" letter-spacing="-0.68px">Discovery &amp; System Logic</text>
<text x="380" y="486.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">We map your operational bottlenecks, user flows, and</text>
<text x="380" y="516.0" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">core business rules before writing production code.</text>
<text x="84" y="623.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">STAGE 02</text>
<text x="84" y="739.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.6px">BLUEPRINT // STRUCTURAL</text>
<text x="380" y="653.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#0D1017" letter-spacing="-0.68px">Architecture &amp; Data Model</text>
<text x="380" y="698.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">We design normalized database schemas, API contracts,</text>
<text x="380" y="728.0" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">and system boundaries built for maintainability.</text>
<text x="84" y="835.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px">STAGE 03</text>
<text x="84" y="951.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.6px">ASSEMBLY // TANGIBLE</text>
<text x="380" y="865.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#0D1017" letter-spacing="-0.68px">Precision Engineering</text>
<text x="380" y="910.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">Iterative full-stack development with clean code</text>
<text x="380" y="940.0" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">standards, automated tests, and milestone demos.</text>
<text x="84" y="1047.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#E84A27" letter-spacing="1.12px">STAGE 04</text>
<text x="84" y="1163.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.6px">PRODUCTION // EXTRAORDINARY</text>
<text x="380" y="1077.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#0D1017" letter-spacing="-0.68px">Deployment &amp; Scale</text>
<text x="380" y="1122.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">Zero-downtime cloud launch, CI/CD pipelines, live</text>
<text x="380" y="1152.0" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5A6072">telemetry, and ongoing engineering partnership.</text>
