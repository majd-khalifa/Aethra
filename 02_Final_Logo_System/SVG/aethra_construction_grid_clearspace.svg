<text x="88" y="75.48" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="14" fill="#0D1017" letter-spacing="1.12px">AETHRA BRAND IDENTITY  //  PHASE 02 — LOGO CONSTRUCTION, CLEAR-SPACE &amp; USAGE RULES</text>
<text x="1536" y="75.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#1838E0" letter-spacing="1.12px" text-anchor="end">SPECIFICATION SHEET 02.A</text>
<text x="68" y="144.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.04px">01 // MATHEMATICAL CONSTRUCTION GRID (120×120 BASE MODULE)</text>
<text x="593.6" y="403.42" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#E84A27">12u PHASE CHANNEL</text>
<text x="94" y="389.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#E84A27">SLOPE = 8:3</text>
<text x="94" y="402.22" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#E84A27">(69.44 DEG)</text>
<text x="68" y="728.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.04px">02 // CLEAR-SPACE RULE (1X PERIMETER) &amp; MINIMUM SIZES</text>
<text x="114" y="807.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#1838E0">1X</text>
<text x="114" y="931.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#1838E0">1X</text>
<text x="566" y="795.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#0D1017">MINIMUM SCALE:</text>
<text x="566" y="825.48" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#5A6072">• Symbol Digital: 16 × 16 px</text>
<text x="566" y="847.18" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#5A6072">• Symbol Print: 5 × 5 mm</text>
<text x="566" y="868.88" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#5A6072">• Lockup Digital: 110 px W</text>
<text x="566" y="890.58" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#5A6072">• Lockup Print: 28 mm W</text>
<text x="566" y="912.28" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#5A6072">• Stacked Digital: 72 px W</text>
<text x="852" y="144.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.04px">03 // APPROVED LOCKUP SYSTEM (LIGHT, DARK &amp; MONOCHROME)</text>
<text x="1506" y="387.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#F5F3EE" text-anchor="end">COBALT REVERSE</text>
<text x="852" y="488.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#E84A27" letter-spacing="1.04px">04 // INCORRECT LOGO USAGE (STRICT PROHIBITIONS)</text>
<text x="894" y="538.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT CLOSE THE CHANNEL</text>
<text x="866" y="649.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">Never fill or bridge the 12u negative-space cut.</text>
<text x="1242" y="538.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT APPLY NEON GLOWS</text>
<text x="1214" y="649.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">No purple/blue gradients or outer glow effects.</text>
<text x="894" y="710.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT CONVERT TO WIREFRAME</text>
<text x="866" y="821.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">The mark relies on solid mass vs. counterform.</text>
<text x="1242" y="710.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT SKEW OR ROTATE</text>
<text x="1214" y="821.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">Never alter the fixed 8:3 architectural pitch.</text>
<text x="894" y="882.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT SUBSTITUTE FONTS</text>
<text x="866" y="993.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">Never type AETHRA in a generic system typeface.</text>
<text x="1018" y="941.68" font-family="'Inter', sans-serif" font-weight="400" font-size="24" fill="#0D1017" text-anchor="middle">A e t h r a</text>
<text x="1242" y="882.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#0D1017">DO NOT LOW-CONTRAST PLACE</text>
<text x="1214" y="993.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#5A6072">Never place Cobalt on mid-tone gray surfaces.</text>
</svg>