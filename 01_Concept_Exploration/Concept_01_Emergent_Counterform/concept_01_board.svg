<text x="88" y="75.48" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="14" fill="#0D1017" letter-spacing="1.12px">AETHRA BRAND IDENTITY  //  PHASE 01 — CONCEPT DIRECTION 01</text>
<text x="1536" y="75.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#E84A27" letter-spacing="1.12px" text-anchor="end">[ SELECTED &amp; REFINED DIRECTION ]</text>
<text x="68" y="146.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#1838E0" letter-spacing="1.3px">CONCEPT 01</text>
<text x="68" y="191.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#0D1017" letter-spacing="-0.85px">The Emergent Counterform</text>
<text x="68" y="223.12" font-family="'Inter', sans-serif" font-weight="500" font-size="16" fill="#5A6072">Architectural Cantilever &amp; Negative-Space Phase Channel</text>
<text x="88" y="283.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">01 // STANDALONE SYMBOL (GEOMETRIC SILHOUETTE)</text>
<text x="68" y="673.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#1838E0" letter-spacing="0.96px">02 // CONCEPTUAL RATIONALE &amp; VISUAL THESIS</text>
<text x="68" y="708.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">CONCEPT: Translates &#x27;From the unseen to the extraordinary&#x27; into pure Gestalt</text>
<text x="68" y="742.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">architecture. Two precision-cut polygons—an ascending structural vault and</text>
<text x="68" y="776.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">a cantilevered horizontal cross-beam—lock together along an 8:3 slope.</text>
<text x="68" y="810.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">WHY IT WORKS: The negative space (&#x27;the unseen&#x27;) is not a passive hole;</text>
<text x="68" y="844.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">it flows from the base around the cantilevered beam and exits through the</text>
<text x="68" y="878.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">upper-right flank, physically carving the &#x27;A&#x27; out of solid mass.</text>
<text x="68" y="912.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#0D1017">VERDICT: Selected direction. Monumental at 16px, unmistakable silhouette.</text>
<text x="652" y="141.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">03 // HORIZONTAL LOCKUP &amp; CUSTOM WORDMARK (LIGHT SURFACE)</text>
<text x="652" y="367.84" font-family="'IBM Plex Mono', sans-serif" font-weight="400" font-size="12" fill="#5A6072" letter-spacing="0.36px">WORDMARK ARCHITECTURE: Custom vector outlines (16:100 stem-to-cap ratio, zero system-font dependency).</text>
<text x="652" y="443.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#F5F3EE" fill-opacity="0.65" letter-spacing="0.72px">04 // DARK-BACKGROUND LOCKUP</text>
<text x="1178" y="443.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">05 // STACKED ARRANGEMENT</text>
<text x="652" y="755.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">06 // PURE BLACK &amp; WHITE MONOCHROME PROOF</text>
<text x="750" y="1001.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#5A6072" text-anchor="middle">100% K POSITIVE</text>
<text x="962" y="1001.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#F5F3EE" fill-opacity="0.7" text-anchor="middle">100% WHITE REVERSE</text>
<text x="1118" y="755.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#5A6072" letter-spacing="0.72px">07 // APP ICON, IG AVATAR &amp; MICRO-SIZE TEST</text>
<text x="1186" y="951.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#5A6072" text-anchor="middle">APP ICON</text>
<text x="1344" y="951.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#5A6072" text-anchor="middle">IG AVATAR</text>
<text x="1466" y="861.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#5A6072" text-anchor="middle">32px</text>
<text x="1466" y="927.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#5A6072" text-anchor="middle">16px</text>
