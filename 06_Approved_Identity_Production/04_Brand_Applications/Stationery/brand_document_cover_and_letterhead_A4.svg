<text x="72" y="74.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">AETHRA // A4 TECHNICAL PROPOSAL COVER &amp; EXECUTIVE LETTERHEAD SYSTEM</text>
<text x="704" y="216.61" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10.5" fill="#5D2BE7" text-anchor="end">DOC // ARCHITECTURE PROPOSAL</text>
<text x="160" y="549.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">SYSTEM ARCHITECTURE</text>
<text x="160" y="566.64" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">&amp; SOFTWARE PROPOSAL</text>
<text x="160" y="628.08" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="44" fill="#171327" letter-spacing="-1.1px">From the unseen</text>
<text x="160" y="675.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="44" fill="#171327" letter-spacing="-1.1px">to the extraordinary.</text>
<text x="160" y="726.25" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12.5" fill="#615B73">Prepared for: [Client Organization Placeholder]</text>
<text x="160" y="747.5" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12.5" fill="#615B73">Project Scope: [System / Application Name Placeholder]</text>
<text x="160" y="768.75" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12.5" fill="#615B73">Document Ref: [AETHRA-DOC-YYYY-01]</text>
<text x="160" y="1013.61" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10.5" fill="#171327">AETHRA — SOFTWARE &amp; DIGITAL SYSTEMS</text>
<text x="1440" y="210.2" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="10" fill="#615B73" text-anchor="end">[website-placeholder]  •  [email-placeholder]</text>
<text x="896" y="292.61" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10.5" fill="#5D2BE7">DATE: [YYYY-MM-DD]    //    SUBJECT: EXECUTIVE SUMMARY &amp; ARCHITECTURE SCOPE</text>
<text x="896" y="346.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">1. Overview &amp; Objectives</text>
<text x="896" y="377.07" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">AETHRA partners with organizations to translate complex operational</text>
<text x="896" y="399.34" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">requirements into structured, maintainable digital products. This</text>
<text x="896" y="421.62" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">document outlines the recommended system architecture, API contracts,</text>
<text x="896" y="443.89" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">and iterative delivery milestones for your platform.</text>
<text x="896" y="514.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">2. Proposed System Architecture</text>
<text x="916" y="559.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">01 // Client Layer</text>
<text x="916" y="578.66" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#171327">Responsive Web Application &amp; Native Mobile Clients</text>
<text x="916" y="627.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">02 // API Gateway</text>
<text x="916" y="646.66" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#171327">Versioned REST / GraphQL Contracts &amp; Access Control</text>
<text x="916" y="695.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">03 // Core Data Layer</text>
<text x="916" y="714.66" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#171327">Relational Database Schema &amp; Automated Pipelines</text>
<text x="896" y="1013.2" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="10" fill="#615B73">AETHRA  //  CONFIDENTIAL TECHNICAL SPECIFICATION</text>
<text x="1440" y="1013.2" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10" fill="#171327" text-anchor="end">PAGE 01</text>
