<text x="1180" y="437.48" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#171327">[website-url-placeholder]</text>
<text x="890" y="476.61" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10.5" fill="#615B73">LOCATION</text>
<text x="890" y="499.48" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#171327">[City / Country Placeholder]</text>
