<text x="136" y="661.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">PRODUCTION SPECIFICATION &amp; PLACEHOLDER INTEGRITY</text>
<text x="136" y="698.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#171327">• Trim Size: Standard 88.9 × 50.8 mm (3.5 × 2.0 in) or 85 × 55 mm EU format on 400gsm uncoated cotton white stock.</text>
<text x="136" y="723.05" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#171327">• Color Reproduction: Front &amp; Back printed on #FCFBFF / #FFFFFF stock with Pantone / CMYK matched Violet (#7446F5 / #5D2BE7) and Deep Ink (#171327).</text>
<text x="136" y="747.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#171327">• Data Integrity: All bracketed fields ([...]) are clean editable placeholders ready for team personalization without fabricated contact details.</text>
