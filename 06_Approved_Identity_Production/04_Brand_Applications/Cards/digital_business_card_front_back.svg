<text x="80" y="82.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">AETHRA // EXECUTIVE &amp; DIGITAL BUSINESS CARD SYSTEM (3.5 × 2 IN PROPORTION)</text>
<text x="1520" y="81.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="end">EDITABLE PLACEHOLDER FIELDS — NO FABRICATED DATA</text>
<text x="100" y="157.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#615B73">01 // FRONT SIDE (LIGHT ARCHITECTURAL SURFACE)</text>
<text x="430" y="513.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" letter-spacing="1.1px" text-anchor="middle">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="840" y="157.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#615B73">02 // REVERSE SIDE (EDITABLE CONTACT TEMPLATE)</text>
<text x="1460" y="240.61" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="10.5" fill="#5D2BE7" text-anchor="end">SOFTWARE &amp; DIGITAL SYSTEMS</text>
<text x="890" y="325.32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="26" fill="#171327">[Full Name Placeholder]</text>
<text x="890" y="352.3" font-family="'Inter', sans-serif" font-weight="500" font-size="15" fill="#5D2BE7">[Role / Engineering Title Placeholder]</text>
