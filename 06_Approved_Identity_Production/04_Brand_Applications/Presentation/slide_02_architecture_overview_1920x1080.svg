<text x="1816" y="105.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" text-anchor="end">01 // TECHNICAL ARCHITECTURE &amp; SERVICES</text>
<text x="104" y="207.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">FULL-STACK CAPABILITIES</text>
<text x="104" y="275.92" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="56" fill="#171327" letter-spacing="-1.4px">Coherent engineering across every layer.</text>
<text x="144" y="418.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">01 // CLIENT INTERFACES</text>
<text x="144" y="470.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">Web &amp; Mobile Applications</text>
<text x="144" y="523.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">Responsive web platforms, customer portals,</text>
<text x="144" y="553.03" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">and native iOS/Android applications built</text>
<text x="144" y="582.48" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">around clarity, accessibility, and fast</text>
<text x="144" y="611.93" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">interaction.</text>
<text x="168" y="684.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Design-Token UI Systems</text>
<text x="168" y="744.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Web Portals &amp; Dashboards</text>
<text x="168" y="804.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  iOS &amp; Android Applications</text>
<text x="728" y="418.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">02 // CORE APPLICATION</text>
<text x="728" y="470.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">Custom Software &amp; APIs</text>
<text x="728" y="523.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">Clean domain modeling, business workflow</text>
<text x="728" y="553.03" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">engines, and versioned REST/GraphQL APIs</text>
<text x="728" y="582.48" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">that keep frontend and backend cleanly</text>
<text x="728" y="611.93" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">decoupled.</text>
<text x="752" y="684.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Custom Business Software</text>
<text x="752" y="744.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Versioned API Contracts</text>
<text x="752" y="804.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Authentication &amp; Permissions</text>
<text x="1312" y="418.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">03 // INFRASTRUCTURE</text>
<text x="1312" y="470.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">Databases &amp; Integrations</text>
<text x="1312" y="523.58" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">Structured relational schemas, event</text>
<text x="1312" y="553.03" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">pipelines, third-party ERP/payment</text>
<text x="1312" y="582.48" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">integrations, and automated deployment</text>
<text x="1312" y="611.93" font-family="'Inter', sans-serif" font-weight="400" font-size="19" fill="#615B73">infrastructure.</text>
<text x="1336" y="684.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Relational Data Modeling</text>
<text x="1336" y="744.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Third-Party Integrations</text>
<text x="1336" y="804.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">•  Workflow Automation</text>
<text x="104" y="985.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">AETHRA BRAND PRESENTATION SYSTEM</text>
<text x="1816" y="985.48" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="14" fill="#615B73" text-anchor="end">SLIDE 02 // ARCHITECTURE OVERVIEW</text>
</svg>