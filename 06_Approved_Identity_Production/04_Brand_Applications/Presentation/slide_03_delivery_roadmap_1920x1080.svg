<text x="1816" y="105.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" text-anchor="end">02 // DELIVERY METHODOLOGY</text>
<text x="104" y="207.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">STRUCTURED EXECUTION</text>
<text x="104" y="275.92" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="56" fill="#171327" letter-spacing="-1.4px">How unseen ideas become dependable systems.</text>
<text x="140" y="411.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7">PHASE 01</text>
<text x="140" y="466.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">Discover &amp; Scope</text>
<text x="140" y="528.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">Align on business logic,</text>
<text x="140" y="559.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">user workflows, and</text>
<text x="140" y="590.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">system constraints.</text>
<text x="160" y="798.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">OUTPUT: SCOPE &amp; SPECIFICATION</text>
<text x="576" y="411.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7">PHASE 02</text>
<text x="576" y="466.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">System Architecture</text>
<text x="576" y="528.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">Design relational schemas,</text>
<text x="576" y="559.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">API contracts, and</text>
<text x="576" y="590.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">interface foundations.</text>
<text x="596" y="798.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">OUTPUT: ARCHITECTURE BLUEPRINT</text>
<text x="1012" y="411.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7">PHASE 03</text>
<text x="1012" y="466.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#171327">Iterative Engineering</text>
<text x="1012" y="528.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">Build frontend, backend,</text>
<text x="1012" y="559.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">and integrations in</text>
<text x="1012" y="590.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">tested increments.</text>
<text x="1032" y="798.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">OUTPUT: WORKING INCREMENTS</text>
<text x="1448" y="411.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#B18CFE">PHASE 04</text>
<text x="1448" y="466.24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="32" fill="#FFFFFF">Launch &amp; Evolution</text>
<text x="1448" y="528.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">Production deployment,</text>
<text x="1448" y="559.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">documentation, monitoring,</text>
<text x="1448" y="590.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">and ongoing care.</text>
<text x="1468" y="798.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#B18CFE">OUTPUT: PRODUCTION RELEASE</text>
<text x="104" y="985.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327">AETHRA BRAND PRESENTATION SYSTEM</text>
<text x="1816" y="985.48" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="14" fill="#615B73" text-anchor="end">SLIDE 03 // DELIVERY ROADMAP</text>
