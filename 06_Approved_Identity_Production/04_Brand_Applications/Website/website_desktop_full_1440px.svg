<text x="620" y="45.3" font-family="'Inter', sans-serif" font-weight="500" font-size="15" fill="#171327">Services</text>
<text x="736" y="45.3" font-family="'Inter', sans-serif" font-weight="500" font-size="15" fill="#171327">Architecture</text>
<text x="852" y="45.3" font-family="'Inter', sans-serif" font-weight="500" font-size="15" fill="#171327">Process</text>
<text x="968" y="45.3" font-family="'Inter', sans-serif" font-weight="500" font-size="15" fill="#171327">About</text>
<text x="1262" y="45.48" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Start a Project</text>
<text x="240" y="174.43" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11.5" fill="#5D2BE7" text-anchor="middle">SOFTWARE ENGINEERING &amp; DIGITAL SYSTEMS</text>
<text x="80" y="271.76" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-2.04px">From the unseen</text>
<text x="80" y="343.84" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-2.04px">to the extraordinary.</text>
<text x="80" y="410.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">AETHRA designs and engineers custom software, web and mobile</text>
<text x="80" y="441.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">applications, backend APIs, and integrated digital systems that</text>
<text x="80" y="472.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">turn complex ideas into dependable products.</text>
<text x="194" y="566.12" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#FFFFFF" text-anchor="middle">Discuss Your Project  -&gt;</text>
<text x="430" y="566.12" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#171327" text-anchor="middle">Explore Capabilities</text>
<text x="886" y="513.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">INTERFACE LAYER</text>
<text x="886" y="535.48" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#171327">Web Apps  •  Mobile Clients  •  Portals</text>
<text x="886" y="589.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">APPLICATION &amp; API LAYER</text>
<text x="886" y="611.48" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#171327">Domain Logic  •  REST / GraphQL  •  Auth</text>
<text x="886" y="665.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">DATA &amp; INFRASTRUCTURE</text>
<text x="886" y="687.48" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#171327">Relational Schemas  •  Pipelines  •  Cloud</text>
<text x="80" y="878.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="1.04px">01 // CAPABILITIES</text>
<text x="80" y="938.08" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="44" fill="#171327" letter-spacing="-0.88px">Engineered for how modern businesses operate.</text>
<text x="127" y="1031.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">01</text>
<text x="108" y="1081.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">Custom Software</text>
<text x="108" y="1116.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Tailored operational platforms, internal</text>
<text x="108" y="1139.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">tools, and core domain systems engineered</text>
<text x="108" y="1163.21" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">around your workflows.</text>
<text x="563" y="1031.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">02</text>
<text x="544" y="1081.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">Web Applications</text>
<text x="544" y="1116.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Fast, accessible browser applications,</text>
<text x="544" y="1139.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">customer portals, and administrative control</text>
<text x="544" y="1163.21" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">planes.</text>
<text x="999" y="1031.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">03</text>
<text x="980" y="1081.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">Mobile Applications</text>
<text x="980" y="1116.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Native and cross-platform iOS and Android</text>
<text x="980" y="1139.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">apps built for responsiveness and clarity.</text>
<text x="127" y="1275.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">04</text>
<text x="108" y="1325.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">Backend &amp; Databases</text>
<text x="108" y="1360.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Resilient server architectures, relational</text>
<text x="108" y="1383.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">data modeling, caching, and cloud</text>
<text x="108" y="1407.21" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">infrastructure.</text>
<text x="563" y="1275.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">05</text>
<text x="544" y="1325.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">APIs &amp; Integrations</text>
<text x="544" y="1360.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Versioned REST and GraphQL contracts</text>
<text x="544" y="1383.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">connecting third-party platforms, ERPs, and</text>
<text x="544" y="1407.21" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">payment systems.</text>
<text x="999" y="1275.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" text-anchor="middle">06</text>
<text x="980" y="1325.68" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="24" fill="#171327">Workflow Automation</text>
<text x="980" y="1360.71" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">Event-driven pipelines and background</text>
<text x="980" y="1383.96" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">services that eliminate repetitive manual</text>
<text x="980" y="1407.21" font-family="'Inter', sans-serif" font-weight="400" font-size="15.5" fill="#615B73">operations.</text>
<text x="128" y="1602.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="1.04px">02 // METHODOLOGY</text>
<text x="128" y="1656.8" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="40" fill="#171327" letter-spacing="-0.8px">A disciplined path from concept to production.</text>
<text x="152" y="1765.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">01 // DISCOVER</text>
<text x="152" y="1804.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">Scope &amp; System Logic</text>
<text x="152" y="1842.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Define objectives, user flows,</text>
<text x="152" y="1864.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">and technical constraints.</text>
<text x="452" y="1765.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">02 // ARCHITECT</text>
<text x="452" y="1804.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">Schema &amp; API Design</text>
<text x="452" y="1842.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Structure data models, contracts,</text>
<text x="452" y="1864.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">and interface foundations.</text>
<text x="752" y="1765.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">03 // BUILD</text>
<text x="752" y="1804.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">Iterative Engineering</text>
<text x="752" y="1842.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Deliver clean, tested increments</text>
<text x="752" y="1864.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">with transparent reviews.</text>
<text x="1052" y="1765.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">04 // DELIVER</text>
<text x="1052" y="1804.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#171327">Launch &amp; Evolution</text>
<text x="1052" y="1842.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Deploy with monitoring, docs,</text>
