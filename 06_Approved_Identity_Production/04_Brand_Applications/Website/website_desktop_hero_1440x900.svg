<text x="80" y="743.94" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="17" fill="#171327">Custom Web &amp; Mobile</text>
<text x="312" y="715.43" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11.5" fill="#5D2BE7">02 // ARCHITECTURE</text>
<text x="312" y="743.94" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="17" fill="#171327">APIs &amp; Backend Systems</text>
<text x="544" y="715.43" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11.5" fill="#5D2BE7">03 // AUTOMATION</text>
<text x="544" y="743.94" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="17" fill="#171327">Connected Workflows</text>
