<text x="1262" y="45.48" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Start a Project</text>
<text x="240" y="186.43" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11.5" fill="#5D2BE7" text-anchor="middle">SOFTWARE ENGINEERING &amp; DIGITAL SYSTEMS</text>
<text x="80" y="283.76" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-2.04px">From the unseen</text>
<text x="80" y="355.84" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-2.04px">to the extraordinary.</text>
<text x="80" y="422.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">AETHRA designs and engineers custom software, web and mobile</text>
<text x="80" y="453.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">applications, backend APIs, and integrated digital systems that</text>
<text x="80" y="484.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">turn complex ideas into dependable products.</text>
<text x="194" y="578.12" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#FFFFFF" text-anchor="middle">Discuss Your Project  -&gt;</text>
<text x="430" y="578.12" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#171327" text-anchor="middle">Explore Capabilities</text>
