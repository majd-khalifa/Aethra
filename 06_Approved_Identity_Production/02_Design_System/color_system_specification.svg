<text x="68" y="497.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">LIGHT-FIRST PRIMARY APPLICATION (75%+ SURFACE AREA)</text>
<text x="104" y="695.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#171327">Engineered clarity on</text>
<text x="104" y="733.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#171327">airy light surfaces.</text>
<text x="104" y="780.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Primary body text uses Deep Ink (#171327)</text>
<text x="104" y="803.55" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">with 17.4:1 AAA contrast, paired with</text>
<text x="104" y="826.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#615B73">Muted Ink (#615B73) at 5.82:1 AA.</text>
<text x="209" y="914.48" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Primary Action -&gt;</text>
<text x="580" y="497.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">INTENTIONAL DARK-CONTEXT COUNTERPART</text>
<text x="616" y="695.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#FCFBFF">Quiet authority in</text>
<text x="616" y="733.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="34" fill="#FCFBFF">dark environments.</text>
<text x="616" y="780.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">Used selectively for developer consoles,</text>
<text x="616" y="803.55" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">code blocks, and dark-mode interfaces</text>
<text x="616" y="826.8" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">without losing the violet brand DNA.</text>
<text x="721" y="914.48" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Explore System -&gt;</text>
<text x="1092" y="497.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">WCAG 2.1 CONTRAST MATRIX</text>
