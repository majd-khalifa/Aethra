<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="middle">03  •  PERSPECTIVE</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#615B73" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="183.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">FROM FRAGMENTATION TO CLARITY</text>
<text x="88" y="251.92" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="56" fill="#171327" letter-spacing="-1.4px">Turning operational</text>
<text x="88" y="312.4" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="56" fill="#171327" letter-spacing="-1.4px">complexity into one</text>
<text x="88" y="372.88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="56" fill="#171327" letter-spacing="-1.4px">coherent system.</text>
<text x="120" y="466.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#615B73" letter-spacing="0.78px">THE CHALLENGE // FRAGMENTED TOOLS</text>
<text x="120" y="510.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">When processes live across disconnected</text>
<text x="120" y="540.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">spreadsheets, manual handoffs, and isolated</text>
<text x="120" y="570.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">apps, teams spend more time maintaining</text>
<text x="120" y="600.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#615B73">workarounds than serving customers.</text>
<text x="680.0" y="497.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="middle">Manual Entry</text>
<text x="870.0" y="489.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="middle">Siloed Data</text>
<text x="775.0" y="583.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="middle">Disconnected API</text>
<text x="690.0" y="669.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="middle">Brittle Sync</text>
<text x="875.0" y="665.84" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="12" fill="#615B73" text-anchor="middle">Delayed Reports</text>
<text x="120" y="824.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#B18CFE" letter-spacing="0.78px">THE SOLUTION // UNIFIED ARCHITECTURE</text>
<text x="120" y="881.52" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="36" fill="#FCFBFF">Engineered around your logic.</text>
<text x="120" y="928.4" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">We design and build custom software that</text>
<text x="120" y="958.8" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">unifies your data layer, backend rules, and</text>
<text x="120" y="989.2" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#A39BB8">user interfaces into one dependable product.</text>
<text x="330" y="1089.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#FCFBFF" text-anchor="middle">WEB  •  MOBILE  •  API  •  DATABASE</text>
