<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="middle">02  •  SERVICES</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#615B73" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="183.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">CORE ENGINEERING CAPABILITIES</text>
<text x="88" y="255.2" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="60" fill="#171327" letter-spacing="-1.5px">Built for how modern</text>
<text x="88" y="320.0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="60" fill="#171327" letter-spacing="-1.5px">businesses operate.</text>
<text x="135" y="428.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="116" y="484.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">Custom Software</text>
<text x="116" y="529.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">Tailored business applications,</text>
<text x="116" y="556.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">operational tools, and core logic.</text>
<text x="595" y="428.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" text-anchor="middle">02</text>
<text x="576" y="484.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">Web Applications</text>
<text x="576" y="529.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">Responsive web platforms, portals,</text>
<text x="576" y="556.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">and modern frontend architecture.</text>
<text x="135" y="692.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" text-anchor="middle">03</text>
<text x="116" y="748.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">Mobile Apps</text>
<text x="116" y="793.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">iOS and Android applications built</text>
<text x="116" y="820.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">for speed, clarity, and reliability.</text>
<text x="595" y="692.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" text-anchor="middle">04</text>
<text x="576" y="748.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">Backend Systems</text>
<text x="576" y="793.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">Scalable server architecture, data</text>
<text x="576" y="820.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">models, and cloud infrastructure.</text>
<text x="135" y="956.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" text-anchor="middle">05</text>
<text x="116" y="1012.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">APIs &amp; Contracts</text>
<text x="116" y="1057.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">Clean REST and GraphQL services</text>
<text x="116" y="1084.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">engineered for long-term stability.</text>
<text x="595" y="956.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" text-anchor="middle">06</text>
<text x="576" y="1012.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#171327">Integrations</text>
<text x="576" y="1057.17" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">Connecting databases, third-party</text>
<text x="576" y="1084.55" font-family="'Inter', sans-serif" font-weight="400" font-size="18.5" fill="#615B73">services, and automated workflows.</text>
