<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="middle">06  •  COLLABORATE</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#615B73" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="363.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">START A PROJECT CONVERSATION</text>
<text x="88" y="440.48" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="64" fill="#171327" letter-spacing="-1.6px">Ready to turn an</text>
<text x="88" y="508.32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="64" fill="#171327" letter-spacing="-1.6px">unseen idea into</text>
<text x="88" y="576.16" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="64" fill="#171327" letter-spacing="-1.6px">working software?</text>
<text x="128" y="696.86" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#171327">Whether you are launching a new digital product, modernizing</text>
<text x="128" y="731.82" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#171327">an existing platform, or connecting complex backend systems,</text>
<text x="128" y="766.78" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#171327">we’re ready to help you architect and build it.</text>
<text x="128" y="868.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">01 // SCOPE</text>
<text x="128" y="901.53" font-family="'Inter', sans-serif" font-weight="500" font-size="16.5" fill="#615B73">Share your goals &amp; requirements</text>
<text x="420" y="868.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">02 // ARCHITECTURE</text>
<text x="420" y="901.53" font-family="'Inter', sans-serif" font-weight="500" font-size="16.5" fill="#615B73">Review technical approach</text>
<text x="712" y="868.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7">03 // DELIVERY</text>
<text x="712" y="901.53" font-family="'Inter', sans-serif" font-weight="500" font-size="16.5" fill="#615B73">Clear milestones &amp; build plan</text>
<text x="136" y="1112.6" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#FFFFFF">Send us a message to discuss your project</text>
<text x="860" y="1112.12" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="16" fill="#5D2BE7" text-anchor="middle">INQUIRE -&gt;</text>
