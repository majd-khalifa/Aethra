<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#B18CFE" letter-spacing="0.78px" text-anchor="middle">05  •  EXPERTISE</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#FCFBFF" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#A39BB8" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="183.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#B18CFE" letter-spacing="1.12px">TECHNICAL ARCHITECTURE INSIGHT</text>
<text x="88" y="253.56" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="58" fill="#FCFBFF" letter-spacing="-1.45px">Why a well-designed</text>
<text x="88" y="316.2" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="58" fill="#FCFBFF" letter-spacing="-1.45px">API layer outlives</text>
<text x="88" y="378.84" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="58" fill="#FCFBFF" letter-spacing="-1.45px">every redesign.</text>
<text x="124" y="496.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#A39BB8" letter-spacing="0.78px">ARCHITECTURE SCHEMATIC // DECOUPLED CORE</text>
<text x="152" y="671.32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="26" fill="#FCFBFF">Core Domain &amp; API</text>
<text x="152" y="709.94" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#A39BB8">• Business logic &amp; permissions</text>
<text x="152" y="737.99" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#A39BB8">• Versioned API contracts</text>
<text x="152" y="766.04" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#A39BB8">• Structured database schema</text>
<text x="152" y="794.09" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#A39BB8">• Automated validation</text>
<text x="612" y="590.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#FCFBFF">Web Application</text>
<text x="612" y="618.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">Customer &amp; internal dashboards</text>
<text x="612" y="704.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#FCFBFF">Mobile Applications</text>
<text x="612" y="732.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">iOS &amp; Android native experiences</text>
<text x="612" y="818.04" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="22" fill="#FCFBFF">Partner Integrations</text>
<text x="612" y="846.3" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#A39BB8">Webhooks, ERPs &amp; third-party tools</text>
<text x="88" y="998.04" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#A39BB8">User interfaces evolve rapidly as your product grows. By separating core</text>
<text x="88" y="1031.48" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#A39BB8">business logic and data behind a clean API contract, you can launch new</text>
<text x="88" y="1064.92" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#A39BB8">apps and refresh interfaces without rewriting your foundation.</text>
