<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="middle">01  •  INTRODUCTION</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#615B73" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="847.76" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-1.7px">From the unseen to</text>
<text x="88" y="919.84" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="68" fill="#171327" letter-spacing="-1.7px">the extraordinary.</text>
<text x="88" y="986.86" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#615B73">Every digital product begins as an unseen idea. Through software</text>
<text x="88" y="1021.82" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#615B73">architecture, clean engineering, and disciplined design, AETHRA</text>
<text x="88" y="1056.78" font-family="'Inter', sans-serif" font-weight="400" font-size="23" fill="#615B73">turns complex vision into reliable, working technology.</text>
<text x="88" y="1139.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">CUSTOM SOFTWARE   •   WEB &amp; MOBILE APPS   •   APIS &amp; SYSTEMS</text>
