<text x="880" y="92.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="middle">04  •  PROCESS</text>
<text x="80" y="1263.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#171327" letter-spacing="1.68px">AETHRA</text>
<text x="1000" y="1262.66" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="13" fill="#615B73" letter-spacing="0.78px" text-anchor="end">FROM THE UNSEEN TO THE EXTRAORDINARY</text>
<text x="88" y="183.48" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="14" fill="#5D2BE7" letter-spacing="1.12px">HOW WE WORK</text>
<text x="88" y="255.2" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="60" fill="#171327" letter-spacing="-1.5px">A disciplined path</text>
<text x="88" y="320.0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="60" fill="#171327" letter-spacing="-1.5px">from idea to release.</text>
<text x="146" y="422.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px">01 // DISCOVER</text>
<text x="146" y="460.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="28" fill="#171327">Clarify Scope &amp; Logic</text>
<text x="146" y="498.76" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">We align on business objectives, user workflows, and technical</text>
<text x="146" y="524.86" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">constraints so every engineering decision has a clear purpose.</text>
<text x="146" y="618.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px">02 // ARCHITECT</text>
<text x="146" y="656.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="28" fill="#171327">Design the Foundation</text>
<text x="146" y="694.76" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">We structure the data schema, API contracts, and interface</text>
<text x="146" y="720.86" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">system before full-scale implementation begins.</text>
<text x="146" y="814.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px">03 // BUILD</text>
<text x="146" y="852.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="28" fill="#171327">Iterative Engineering</text>
<text x="146" y="890.76" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">Clean, maintainable code across frontend and backend, shared</text>
<text x="146" y="916.86" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">through regular working builds and transparent reviews.</text>
<text x="146" y="1010.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px">04 // DELIVER</text>
<text x="146" y="1048.96" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="28" fill="#171327">Launch &amp; Long-Term Care</text>
<text x="146" y="1086.76" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">Thorough testing, smooth deployment, clear documentation,</text>
<text x="146" y="1112.86" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#615B73">and continued support as your product evolves.</text>
</svg>