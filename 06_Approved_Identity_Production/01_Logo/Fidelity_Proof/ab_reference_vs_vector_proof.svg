<text x="88" y="74.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#171327" letter-spacing="0.78px">AETHRA LOGO FIDELITY PROOF  //  A/B SOURCE SCREENSHOT VS. RECONSTRUCTED VECTOR MASTER</text>
<text x="1536" y="74.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="end">PHASE 01 — VERIFICATION</text>
<text x="68" y="137.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#615B73" letter-spacing="0.6px">A // SUPPLIED RASTER REFERENCE (265 × 136 PX SCREENSHOT)</text>
<text x="832" y="137.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">B // RECONSTRUCTED EDITABLE SVG VECTOR MASTER (INFINITE RESOLUTION)</text>
<text x="68" y="601.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">C // PIXEL-SCALE LEGIBILITY PROOF (128 PX DOWN TO 16 PX FAVICON)</text>
<text x="104" y="653.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">OFFICIAL MASTER GEOMETRY (8.7% STROKE):</text>
<text x="168.0" y="831.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" text-anchor="middle">128 px</text>
<text x="316.0" y="831.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" text-anchor="middle">64 px</text>
<text x="424.0" y="831.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" text-anchor="middle">32 px</text>
<text x="514.0" y="831.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" text-anchor="middle">24 px</text>
<text x="596.0" y="831.02" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="11" fill="#615B73" text-anchor="middle">16 px</text>
<text x="104" y="885.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">OPTICAL MICRO-ICON VARIANT (+32% STROKE FOR &lt;=24PX FAVICONS):</text>
<text x="168" y="930.66" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#171327">24 × 24 px Micro-Icon (Dark &amp; Light)</text>
<text x="168" y="951.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Preserves rising diagonal &amp; lower-right foot without subpixel drop-out.</text>
<text x="168" y="994.66" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#171327">16 × 16 px Micro-Icon (Browser Tab Favicon)</text>
<text x="168" y="1015.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">At 16px, official master stroke is 1.15px; optical micro-icon boosts stroke to 1.52px.</text>
<text x="832" y="601.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">D // VECTOR RECONSTRUCTION AUDIT &amp; OPTICAL CORRECTIONS</text>
<text x="860" y="657.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">01 // OUTER TRIANGULAR SYMMETRY &amp; SLOPE</text>
<text x="860" y="680.66" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">Sampled apex at (137.0, 19.3) and base tips at (100.0, 86.0) &amp; (174.2, 86.0).</text>
<text x="860" y="699.12" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">Normalized to an exact 9:5 (1.80) rise-to-run slope (60.95° base angle).</text>
<text x="860" y="757.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">02 // RISING DIAGONAL INNER CROSS-STROKE</text>
<text x="860" y="780.66" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">Originates from the lower-left tip and ascends at 21.03° to join the inner</text>
<text x="860" y="799.12" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">right leg at 62% height, carving the signature asymmetrical upper counter.</text>
<text x="860" y="857.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">03 // OPEN LOWER GEOMETRY &amp; RIGHT-SIDE TERMINAL</text>
<text x="860" y="880.66" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">Lower-right leg turns horizontally inward from x=900 to x=584, terminating</text>
<text x="860" y="899.12" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">in a crisp angled notch (549.2, 797.4) strictly parallel to the 9:5 right leg.</text>
<text x="860" y="957.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7">04 // UNIFORM STROKE WEIGHT &amp; WORDMARK</text>
<text x="860" y="980.66" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">All four structural segments unified to an exact 62.6u (8.7%) perpendicular</text>
<text x="860" y="999.12" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#615B73">stroke width. Wordmark AETHRA uses custom open-chevron &#x27;A&#x27; glyphs.</text>
</svg>