<text x="88" y="74.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#171327" letter-spacing="0.78px">AETHRA LOGO SYSTEM  //  CONSTRUCTION GEOMETRY, CLEAR-SPACE &amp; MISUSE RULES</text>
<text x="1536" y="74.66" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="13" fill="#5D2BE7" letter-spacing="0.78px" text-anchor="end">SPECIFICATION 01.B</text>
<text x="68" y="137.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">01 // CANONICAL VECTOR CONSTRUCTION (1000 × 1000 MASTER GRID)</text>
<text x="88" y="335.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">OUTER SLOPE</text>
<text x="88" y="348.77" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">9:5 (60.95°)</text>
<text x="656" y="435.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">RISING DIAGONAL</text>
<text x="656" y="448.77" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">CROSS-STROKE</text>
<text x="656" y="462.52" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">(+21.03°)</text>
<text x="656" y="551.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#615B73">OPEN BASE FOOT</text>
<text x="656" y="564.77" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#615B73">NOTCH AT 9:5</text>
<text x="68" y="701.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">02 // CLEAR-SPACE RULE (0.25H ISOLATION ZONE) &amp; MINIMUM SIZES</text>
<text x="114" y="775.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#5D2BE7">0.25H</text>
<text x="494" y="771.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#171327">MINIMUM SIZE THRESHOLDS:</text>
<text x="494" y="803.07" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Stacked Lockup: 80 px height (digital)</text>
<text x="494" y="824.67" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Horizontal Lockup: 120 px width</text>
<text x="494" y="846.27" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Standalone Master Mark: 28 × 28 px</text>
<text x="494" y="867.87" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Optical Micro-Icon: 16 × 16 px — 24 × 24 px</text>
<text x="494" y="889.47" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Print Symbol Minimum: 6 × 6 mm</text>
<text x="494" y="911.07" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#615B73">• Aspect Ratio: 10:9 (Mark) / Locked</text>
<text x="820" y="137.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#5D2BE7" letter-spacing="0.6px">03 // CANONICAL COLOR &amp; MONOCHROME VARIANTS</text>
<text x="1152" y="320.2" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="10" fill="#615B73" text-anchor="end">100% BLACK</text>
<text x="1516" y="320.2" font-family="'IBM Plex Mono', sans-serif" font-weight="500" font-size="10" fill="#FFFFFF" fill-opacity="0.7" text-anchor="end">100% WHITE</text>
<text x="820" y="451.84" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="12" fill="#D92D20" letter-spacing="0.6px">04 // INCORRECT LOGO USAGE (STRICT PROHIBITIONS)</text>
<text x="862" y="498.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT REPLACE CROSSBAR</text>
<text x="834" y="631.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Never use a flat conventional crossbar.</text>
<text x="1226" y="498.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT ROUND OR BUBBLE</text>
<text x="1198" y="631.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Preserve straight edges and sharp corners.</text>
<text x="862" y="696.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT CLOSE LOWER BASE</text>
<text x="834" y="829.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Keep the asymmetrical open lower geometry.</text>
<text x="1226" y="696.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT SWITCH TO NEON/CYAN</text>
<text x="1198" y="829.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Keep the approved violet &amp; ink palette.</text>
<text x="862" y="894.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT ALTER WORDMARK</text>
<text x="834" y="1027.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Never substitute a generic serif/sans font.</text>
<text x="994" y="966.96" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#171327" text-anchor="middle">Aethra</text>
<text x="1226" y="894.02" font-family="'IBM Plex Mono', sans-serif" font-weight="600" font-size="11" fill="#171327">DO NOT ADD EXTRA SYMBOLS</text>
<text x="1198" y="1027.84" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#615B73">Never place stars or icons beside the A.</text>
